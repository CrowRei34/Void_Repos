name: Install xbps static
description: >
  Downloads the official Void Linux static xbps tarball, extracts it and makes
  the xbps userland available on PATH for this and subsequent workflow steps.
  Used by build/release jobs that run on ubuntu-latest runners, which don't
  ship the xbps tools.

runs:
  using: composite
  steps:
    - name: Download, extract and expose xbps
      shell: bash
      run: |
        set -euo pipefail

        # The xbps static tarball from repo-default.voidlinux.org/static
        # extracts to usr/bin/ (confirmed layout: xbps-static/usr/bin/xbps-*).
        wget -q https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz \
          -O xbps-static.tar.xz
        mkdir -p xbps-static
        tar -xf xbps-static.tar.xz -C xbps-static

        BIN_DIR="$PWD/xbps-static/usr/bin"

        if [ ! -x "$BIN_DIR/xbps-remove" ]; then
          echo "::error::xbps-remove not found at $BIN_DIR. Tarball layout:"
          find xbps-static -maxdepth 4 -mindepth 1 -print
          exit 1
        fi

        # Expose for this step and for all subsequent steps in the job.
        echo "$BIN_DIR" >> "$GITHUB_PATH"
        export PATH="$BIN_DIR:$PATH"

        # Sanity checks: print versions of the tools the build/release steps need.
        echo "xbps binaries at: $BIN_DIR"
        xbps-install --version
        xbps-remove   --version
        xbps-create   --version
        xbps-rindex   --version
        xbps-uchroot  --version
        xbps-uunshare --version
