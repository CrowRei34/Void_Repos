name: Build XBPS packages

on:
  # Compilar cuando se hace push a las ramas principales o se editan los templates.
  push:
    branches: [main, master]
    paths:
      - 'srcpkgs/**'
      - '.github/workflows/build-packages.yml'
  # Compilar manualmente desde la pestaña "Actions".
  workflow_dispatch:
  # Recompilar mensualmente para mantener frescos los binarios.
  schedule:
    - cron: '0 3 1 * *'

jobs:
  # ---------------------------------------------------------------- ani-cli ----
  # ani-cli es un script de shell: solo necesita xbps-src para empaquetarlo.
  # Construimos dentro de un contenedor Void para tener xbps nativo y los
  # privilegios de user namespace que xbps-src requiere (ubuntu-latest los niega).
  build-ani-cli:
    name: ani-cli (x86_64)
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux:latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build prerequisites
        # base-chroot provee el entorno mínimo que xbps-src necesita para
        # construir dentro del chroot. git para clonar void-packages.
        run: |
          xbps-install -Suy || true
          xbps-install -y base-chroot git

      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git /tmp/void-packages

      - name: Copy template
        run: |
          cp -r srcpkgs/ani-cli /tmp/void-packages/srcpkgs/

      - name: Bootstrap and build
        run: |
          cd /tmp/void-packages
          # Dentro del contenedor Void, como root, xbps-src puede usar
          # xbps-uchroot sin problemas de /proc/self/uid_map.
          ./xbps-src binary-bootstrap
          # ani-cli es arch-agnóstico (noarch).
          ./xbps-src pkg ani-cli

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp /tmp/void-packages/hostdir/binpkgs/ani-cli-*.xbps artifacts/ || true
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ani-cli-xbps
          path: artifacts/*.xbps
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- librewolf ----
  # librewolf es un wrapper: baja el binario precompilado de index-0/librewolf-void
  # y lo desempaqueta. Solo soportamos x86_64 (glibc).
  build-librewolf:
    name: librewolf (x86_64)
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux:latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          xbps-install -Suy || true
          xbps-install -y base-chroot git

      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git /tmp/void-packages

      - name: Copy template
        run: |
          cp -r srcpkgs/librewolf /tmp/void-packages/srcpkgs/

      - name: Bootstrap and build
        run: |
          cd /tmp/void-packages
          ./xbps-src binary-bootstrap
          ./xbps-src pkg librewolf

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp /tmp/void-packages/hostdir/binpkgs/librewolf-*.xbps artifacts/ || true
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librewolf-xbps
          path: artifacts/*.xbps
          if-no-files-found: error
          retention-days: 14

  # ----------------------------------------------- publicar release en GitHub ----
  # El job de release NO necesita user namespaces (solo xbps-rindex para indexar),
  # así que puede quedarse en ubuntu-latest con el tarball estático.
  release:
    name: Publish GitHub release
    needs: [build-ani-cli, build-librewolf]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para crear/editar releases y subir assets
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: false

      - name: Stage all .xbps into one directory
        run: |
          mkdir -p repo
          find all-artifacts -name '*.xbps' -exec cp -v {} repo/ \;
          ls -la repo/

      - name: Install xbps static (for xbps-rindex)
        uses: ./.github/actions/install-xbps

      - name: Generate repodata
        # xbps-rindex --add indexa los paquetes y genera <arch>-repodata.
        run: |
          cd repo
          xbps-rindex --add ./*.xbps
          ls -la

      - name: Determine release tag
        id: tag
        run: |
          TAG="$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Packages ${{ steps.tag.outputs.tag }}
          body: |
            Paquetes XBPS generados automáticamente desde `${{ github.sha }}`.

            ## Uso

            ```bash
            sudo tee /etc/xbps.d/20-nk.conf >/dev/null <<EOF
            repository=${{ github.server_url }}/${{ github.repository }}/releases/latest/download/
            EOF
            sudo xbps-install -Su ani-cli librewolf
            ```
          files: repo/*
          generate_release_notes: true
