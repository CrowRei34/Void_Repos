name: Build XBPS packages

on:
  push:
    branches: [main, master]
    paths:
      - 'srcpkgs/**'
      - '.github/workflows/build-packages.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'

jobs:
  # --------------------------------------------------------------- build ----
  # Patrón basado en void-mklive (imagen oficial Void ya preparada) + container
  # --privileged. Esto resuelve de raíz todos los problemas que teníamos:
  #   - xbps nativo (sin tarball estático)
  #   - user namespaces funcionando (--privileged)
  #   - grupo xbuilder para xbps-uchroot
  # No necesitamos ethereal: el modo normal (uchroot) funciona con privilegios.
  build:
    name: Build (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    container:
      image: 'ghcr.io/void-linux/void-mklive:20250116R1'
      options: --privileged
    steps:
      - name: Fix SSL and install tools
        # --repository en la línea de comando evita pelear con configs de mirror.
        # repo-de.voidlinux.org es estable y tiene TLS correcto.
        run: |
          xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/ xbps
          xbps-install -Suyd --repository=https://repo-de.voidlinux.org/current/
          xbps-install -y --repository=https://repo-de.voidlinux.org/current/ \
            git ca-certificates sudo base-devel xtools tar

          # xbps-src requiere un usuario no-root en el grupo xbuilder.
          groupadd -f xbuilder
          useradd -m -s /bin/bash -G xbuilder builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone void-packages and copy templates
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git /tmp/void-packages
          cp -r srcpkgs/ani-cli   /tmp/void-packages/srcpkgs/
          cp -r srcpkgs/uwuprite  /tmp/void-packages/srcpkgs/
          chown -R builder:builder /tmp/void-packages

      - name: Bootstrap and build ani-cli
        run: |
          su - builder -c "cd /tmp/void-packages && ./xbps-src binary-bootstrap"
          su - builder -c "cd /tmp/void-packages && ./xbps-src pkg ani-cli"

      - name: Build uwuprite
        run: |
          su - builder -c "cd /tmp/void-packages && ./xbps-src pkg uwuprite"

      - name: Sign, index and export pubkey
        # Sign every .xbps with the private key (secret), then index the repo
        # and sign the repodata. Also export the public key so users can trust it.
        # xbps-rindex is native to the Void container, so no static tarball needed.
        env:
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
          XBPS_PASSPHRASE: ${{ secrets.XBPS_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail

          # --- Validate the secret is present ---
          if [ -z "${XBPS_PRIVATE_KEY:-}" ]; then
            echo "::error::Secret XBPS_PRIVATE_KEY is empty or not set."
            echo "Generate an RSA key (openssl genrsa -out privkey.pem 4096) and"
            echo "paste the full PEM contents as the XBPS_PRIVATE_KEY secret in"
            echo "Settings > Secrets and variables > Actions."
            exit 1
          fi

          # --- Write the key to disk exactly as stored (multi-line PEM) ---
          # NOTE: GitHub secrets preserve newlines, so plain redirection works
          # and is safer than printf for multi-line content.
          printf '%s\n' "$XBPS_PRIVATE_KEY" > /tmp/privkey.pem
          chmod 600 /tmp/privkey.pem

          # --- Diagnostics (size + first/last line only; no key body) ---
          _bytes=$(wc -c < /tmp/privkey.pem)
          _head=$(head -n1 /tmp/privkey.pem)
          _tail=$(tail -n1 /tmp/privkey.pem)
          echo "privkey size: ${_bytes} bytes"
          echo "privkey first line: ${_head}"
          echo "privkey last line:  ${_tail}"
          if [ "$_bytes" -lt 100 ] || \
             ! grep -q -- 'PRIVATE KEY' /tmp/privkey.pem; then
            echo "::error::privkey.pem does not look like a PEM private key."
            echo "Expected a header like '-----BEGIN ... PRIVATE KEY-----'."
            echo "Make sure the secret contains the FULL PEM file incl. headers."
            exit 1
          fi

          cd /tmp/void-packages/hostdir/binpkgs

          # --- Verify the key actually parses before signing ---
          openssl rsa -in /tmp/privkey.pem -check -noout \
            ${XBPS_PASSPHRASE:+-passin pass:"$XBPS_PASSPHRASE"} \
            || { echo "::error::openssl could not parse privkey.pem"; exit 1; }

          # --- Sign each package (.xbps -> .xbps.sig2) ---
          if [ -n "${XBPS_PASSPHRASE:-}" ]; then
            xbps-rindex --sign-pkg --privkey /tmp/privkey.pem --signedby "CrowRei34" *.xbps
          else
            xbps-rindex --sign-pkg --privkey /tmp/privkey.pem *.xbps
          fi

          # --- Add packages to the repo index and sign the repodata ---
          xbps-rindex --add *.xbps
          xbps-rindex --sign --signedby "CrowRei34" --privkey /tmp/privkey.pem .

          # --- Export the public key so the release ships it for user trust ---
          openssl rsa -in /tmp/privkey.pem -pubout -out pubkey.pem \
            ${XBPS_PASSPHRASE:+-passin pass:"$XBPS_PASSPHRASE"} 2>/dev/null || true

          # --- Clean up the private key ---
          shred -u /tmp/privkey.pem 2>/dev/null || rm -f /tmp/privkey.pem

          echo "=== Final repo contents ==="
          ls -la

      - name: Upload repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbps-repo
          path: |
            /tmp/void-packages/hostdir/binpkgs/*.xbps
            /tmp/void-packages/hostdir/binpkgs/*.sig2
            /tmp/void-packages/hostdir/binpkgs/*-repodata
            /tmp/void-packages/hostdir/binpkgs/pubkey.pem
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------- publish release ----
  # The build job already signed (.sig2), indexed (-repodata) and exported the
  # public key. We just stage everything and publish the release.
  release:
    name: Publish GitHub release
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download repo artifact
        uses: actions/download-artifact@v4
        with:
          name: xbps-repo
          path: repo

      - name: Inspect staged repo
        run: ls -la repo/

      - name: Determine release tag
        id: tag
        run: |
          TAG="$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Packages ${{ steps.tag.outputs.tag }}
          body: |
            Paquetes XBPS generados automáticamente desde `${{ github.sha }}`.

            ## Uso

            1. Confiar en la clave pública (una sola vez):

            ```bash
            curl -O ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/pubkey.pem
            sudo cp pubkey.pem /var/db/xbps/keys/   # o el path que use tu Void
            ```

            2. Agregar el repo e instalar:

            ```bash
            sudo tee /etc/xbps.d/20-nk.conf >/dev/null <<EOF
            repository=${{ github.server_url }}/${{ github.repository }}/releases/latest/download/
            EOF
            sudo xbps-install -Su ani-cli uwuprite
            ```
          files: repo/*
          generate_release_notes: true
