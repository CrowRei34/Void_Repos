name: Build XBPS packages

on:
  push:
    branches: [main, master]
    paths:
      - 'srcpkgs/**'
      - '.github/workflows/build-packages.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'

jobs:
  # ---------------------------------------------------------------- ani-cli ----
  # ani-cli es un script de shell: solo necesita xbps-src para empaquetarlo.
  # Corremos dentro de un contenedor Void (host Void real) y usamos
  # XBPS_CHROOT_CMD=ethereal para evitar user namespaces (bloqueados en CI):
  # ethereal construye directamente en el host del contenedor, sin chroot.
  build-ani-cli:
    name: ani-cli (x86_64)
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux:latest
    env:
      XBPS_CHROOT_CMD: ethereal
    steps:
      - name: Install prerequisites
        # MUST be the first step. libstdc++ is needed by the Node runtime of
        # actions/*. Pin the canonical mirror (some geo mirrors have broken TLS).
        # Update xbps itself FIRST, then the rest.
        # bash: xbps-src shebang is #!/bin/bash but base image only has /bin/sh.
        # sudo + builder user: xbps-src refuses to run as root.
        run: |
          rm -f /usr/share/xbps.d/*repository*.conf /etc/xbps.d/*repository*.conf
          mkdir -p /etc/xbps.d
          printf 'repository=https://repo-default.voidlinux.org/current\n'        > /etc/xbps.d/00-repository-main.conf
          printf 'repository=https://repo-default.voidlinux.org/current/nonfree\n' > /etc/xbps.d/05-repository-nonfree.conf
          xbps-install -Suy xbps
          xbps-install -Suy
          xbps-install -y bash libstdc++ git sudo
          # xbps-src refuses to run as root -> create unprivileged builder.
          id builder >/dev/null 2>&1 || useradd -m -s /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          # Shared, fixed workspace both root and builder can write to.
          mkdir -p /build
          chown -R builder:builder /build

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git /build/void-packages
          chown -R builder:builder /build/void-packages

      - name: Copy template
        run: cp -r srcpkgs/ani-cli /build/void-packages/srcpkgs/

      - name: Bootstrap and build
        # Run as unprivileged 'builder'. ethereal = build on host, no chroot,
        # no user namespaces. binary-bootstrap installs deps into the host
        # container (needs sudo, which builder has via sudoers.d).
        run: |
          sudo -u builder bash -c '
            export XBPS_CHROOT_CMD=ethereal
            cd /build/void-packages
            ./xbps-src binary-bootstrap
            ./xbps-src pkg ani-cli
          '

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find /build/void-packages/hostdir/binpkgs -name 'ani-cli-*.xbps' -exec cp -v {} artifacts/ \; || true
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ani-cli-xbps
          path: artifacts/*.xbps
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- librewolf ----
  # librewolf es un wrapper: baja el binario precompilado de index-0/librewolf-void
  # y lo desempaqueta. Solo soportamos x86_64 (glibc).
  build-librewolf:
    name: librewolf (x86_64)
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux:latest
    env:
      XBPS_CHROOT_CMD: ethereal
    steps:
      - name: Install prerequisites
        run: |
          rm -f /usr/share/xbps.d/*repository*.conf /etc/xbps.d/*repository*.conf
          mkdir -p /etc/xbps.d
          printf 'repository=https://repo-default.voidlinux.org/current\n'        > /etc/xbps.d/00-repository-main.conf
          printf 'repository=https://repo-default.voidlinux.org/current/nonfree\n' > /etc/xbps.d/05-repository-nonfree.conf
          xbps-install -Suy xbps
          xbps-install -Suy
          xbps-install -y bash libstdc++ git sudo
          id builder >/dev/null 2>&1 || useradd -m -s /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          mkdir -p /build
          chown -R builder:builder /build

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git /build/void-packages
          chown -R builder:builder /build/void-packages

      - name: Copy template
        run: cp -r srcpkgs/librewolf /build/void-packages/srcpkgs/

      - name: Bootstrap and build
        run: |
          sudo -u builder bash -c '
            export XBPS_CHROOT_CMD=ethereal
            cd /build/void-packages
            ./xbps-src binary-bootstrap
            ./xbps-src pkg librewolf
          '

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find /build/void-packages/hostdir/binpkgs -name 'librewolf-*.xbps' -exec cp -v {} artifacts/ \; || true
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librewolf-xbps
          path: artifacts/*.xbps
          if-no-files-found: error
          retention-days: 14

  # ----------------------------------------------- publicar release en GitHub ----
  # El release job no necesita user namespaces (solo xbps-rindex), así que
  # corre en ubuntu-latest con el tarball estático.
  release:
    name: Publish GitHub release
    needs: [build-ani-cli, build-librewolf]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: false

      - name: Stage all .xbps into one directory
        run: |
          mkdir -p repo
          find all-artifacts -name '*.xbps' -exec cp -v {} repo/ \;
          ls -la repo/

      - name: Install xbps static (for xbps-rindex)
        uses: ./.github/actions/install-xbps

      - name: Generate repodata
        run: |
          cd repo
          xbps-rindex --add ./*.xbps
          ls -la

      - name: Determine release tag
        id: tag
        run: |
          TAG="$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Packages ${{ steps.tag.outputs.tag }}
          body: |
            Paquetes XBPS generados automáticamente desde `${{ github.sha }}`.

            ## Uso

            ```bash
            sudo tee /etc/xbps.d/20-nk.conf >/dev/null <<EOF
            repository=${{ github.server_url }}/${{ github.repository }}/releases/latest/download/
            EOF
            sudo xbps-install -Su ani-cli librewolf
            ```
          files: repo/*
          generate_release_notes: true
