name: Update release-backed templates

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update versions and checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/maintain

      - name: Commit updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/template'
          git commit -m "Update release-backed templates"
          git push
